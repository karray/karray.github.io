kicker: Real images · compare encoder responses
dock_label: Choose an image to compare
overlay: /assets/img/posts/lafam/figures/heatmaps/{layer}_{row}_{item}.png
opacity: 100
reveal_label: Reveal the image under the pointer

help: >-
  Pick an image from the dock, then read across a row to compare the coarse
  heatmap produced by averaging with its AnyUp refinement and with the relevance LRP propagates
  back to the pixels. Move over a map and it falls away around the pointer;
  press and hold to clear the whole map from the point you pressed, and let
  go to bring it back. On a touch screen, tap a map or hold a finger on it.

caption: >-
  Each panel pairs the same photograph with a precomputed heatmap, so no inference
  runs in the browser. The reveal gesture pulls the map back around the
  pointer, which makes it easier to check what the response is sitting on.
  Every map is scaled on its own, the Averaging and AnyUp maps between their
  minimum and maximum and the LRP maps by their maximum, so brightness
  compares positions within a panel and not across panels. The LRP panels
  show the positive part of the relevance, averaged over the colour channels.

