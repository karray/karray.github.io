# Gallery for the LaFAM / AnyUp comparison. Rendered by
# _includes/figure-gallery.html; see that file for the full schema.

kicker: Real images · compare encoder responses
dock_label: Choose an image to compare
overlay: /assets/img/posts/lafam/figures/heatmaps/{layer}_{row}_{item}.png
opacity: 100
reveal_label: Reveal the image under the pointer

help: >-
  Pick an image from the dock, then read across a row to compare the coarse
  LaFAM map with its AnyUp refinement. Move over a map and it falls away
  around the pointer; press and hold to clear the whole map from the point
  you pressed, and let go to bring it back.

caption: >-
  Each panel pairs the same photograph with a precomputed map, so no inference
  runs in the browser. The reveal gesture pulls the map back around the
  pointer, which makes it easier to check what the response is sitting on.

columns:
