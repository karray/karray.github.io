<figure class="lrp-fig lrpb wide" data-lrp-blocks data-src="{{ '/assets/data/label-free-lrp/blocks.json' | relative_url }}" data-image="{{ '/assets/img/samples/dog_and_cat.jpg' | relative_url }}">
  <p class="lrp-kicker">{{ include.kicker | default: 'Inside a block' }}</p>
  <div class="lrpb-legend">
    <span><i class="lrpb-key"></i>zennit has a rule</span>
    <span><i class="lrpb-key lrpb-key--missing"></i>no rule in zennit</span>
  </div>
  <div class="lrpb-layout">
    <div class="lrpb-diagrams">
      <div class="lrpb-diagram" data-model="convnext"></div>
      <div class="lrpb-diagram" data-model="vit"></div>
    </div>
    <div class="lrpb-panel" aria-live="polite"><p>This figure needs JavaScript.</p></div>
  </div>
  <figcaption>{{ include.caption | default: 'A ConvNeXt block and a ViT block. The thick line on the left carries the input past the block, and the plus sign adds the block’s result to it. Parts with a dashed border have no rule in zennit. Hover or tap a part to see what it computes. The values come from one cell on the dog’s face in the image, inside a block halfway through each network.' }}</figcaption>
</figure>
<script src="{{ '/assets/js/posts/label-free-lrp-blocks.js' | relative_url }}" defer></script>
