<figure class="fig lrp-fig lrp-neuron"{% if include.id %} id="{{ include.id }}"{% endif %} data-lrp-toy="neuron">
  {%- capture fig_kicker %}{% include fig-kicker.html id=include.id kicker=include.kicker %}{% endcapture %}
  {%- if fig_kicker != '' %}<p class="fig-kicker">{{ fig_kicker }}</p>{% endif %}
  <div class="lrp-nt-holder"></div>
  <div class="lrp-nt-bar">
    <p class="lrp-nt-eqline">output = <output class="lrp-nt-eq">2.0</output></p>
    <div class="lrp-buttons lrp-nt-modes" role="group" aria-label="How the relevance is passed back">
      <button type="button" value="grad" aria-pressed="true">Gradient fallback</button>
      <button type="button" value="zplus" aria-pressed="false">z⁺ rule</button>
      <button type="button" value="lrp0" aria-pressed="false">LRP-0</button>
    </div>
  </div>
  <p class="lrp-small lrp-nt-note" aria-live="polite">This figure needs JavaScript.</p>
</figure>
