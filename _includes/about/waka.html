{%- assign w = site.data.waka -%}
{%- if w %}
<div class="section">
  <h2 id="wakatime-stats">$ cat wakatime_stats.json</h2>
  <div class="waka">
    <p>From: {{ w.start | date: "%d %B %Y" }}<br>To: {{ w.end | date: "%d %B %Y" }}<br>Total Time: {{ w.total }}</p>
    <table>
      {%- for l in w.languages %}
      <tr><td>{{ l.name }}</td><td>{{ l.time }}</td><td><svg class="bar" viewBox="0 0 400 15" preserveAspectRatio="none"><text x="0" y="50%" textLength="400" lengthAdjust="spacingAndGlyphs">{{ l.bar }}</text></svg></td><td>{{ l.percent }}</td></tr>
      {%- endfor %}
    </table>
  </div>
</div>
{%- endif %}
