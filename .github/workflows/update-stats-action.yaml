name: push-stats-action
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  push-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create data directory
        run: |
          mkdir -p _data

      - name: Define a safe fetch
        run: |
          # fetch_json URL FILE: replace FILE only if the response is valid JSON (keeps the old data otherwise)
          cat > /tmp/fetch_json.sh <<'SH'
          url="$1"; out="$2"; tmp="$(mktemp)"
          for i in 1 2 3; do
            if curl -s --compressed "$url" > "$tmp" && jq -e . "$tmp" > /dev/null 2>&1; then
              mv "$tmp" "$out"; echo "updated $out"; exit 0
            fi
            echo "attempt $i: no valid JSON from $url"; sleep 5
          done
          rm -f "$tmp"; echo "::warning::kept the previous $out (no valid JSON from $url)"
          SH
          chmod +x /tmp/fetch_json.sh

      - name: Fetch waka stats
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          # the secret is a WakaTime OAuth token (API keys only work in plugins from November 2026);
          # the stats are shaped into the rows the About page prints
          curl -s "https://wakatime.com/api/v1/users/current/stats/all_time?api_key=$WAKATIME_API_KEY" > /tmp/waka.json
          if jq -e '.data.languages | length > 0' /tmp/waka.json > /dev/null 2>&1; then
            jq '
              def dhm: (. / 60 | floor) as $m | "\($m / 1440 | floor)d \($m % 1440 / 60 | floor)h \($m % 60)m";
              def bar: (. * 0.25) as $x | ($x | floor) as $n | "█" * $n + (if $x - $n > 0.5 then "▓" else "▒" end) + "░" * (24 - $n);
              def pct: (. * 100 | round + 10000 | tostring) as $s | $s[1:3] + "." + $s[3:] + "%";
              .data
              | (.languages | map(select(.percent >= 1 and (.name | test("other|text|git|nginx|csv|json|yaml|markdown|roff|ini|toml"; "i") | not)))) as $l
              | {start, end, total: (.total_seconds | dhm),
                 languages: ($l + [{name: "Other", percent: (100 - ($l | map(.percent) | add)), total_seconds: (.total_seconds - ($l | map(.total_seconds) | add))}]
                   | map({name, time: (.total_seconds | dhm), bar: (.percent | bar), percent: (.percent | pct)}))}
            ' /tmp/waka.json > _data/waka.json
          else
            echo "::warning::kept the previous _data/waka.json (no languages from WakaTime)"
          fi

      - name: Fetch stackoverflow reputation
        run: |
          /tmp/fetch_json.sh "https://stackoverflow.com/users/flair/2329060.json" _data/stackoverflow_reputation.json

      - name: Fetch stackoverflow tags
        run: |
          /tmp/fetch_json.sh 'https://api.stackexchange.com/2.3/users/2329060/tags?pagesize=100&order=desc&sort=popular&site=stackoverflow&filter=!bMsg5CXICfJ)0K' _data/stackoverflow_tags.json

      - name: Fetch ai stackexchange reputation
        run: |
          /tmp/fetch_json.sh "https://ai.stackexchange.com/users/flair/12841.json" _data/ai_reputation.json

      - name: Fetch ai stackexchange tags
        run: |
          /tmp/fetch_json.sh 'https://api.stackexchange.com/2.3/users/12841/tags?pagesize=100&order=desc&sort=popular&site=ai&filter=!bMsg5CXICfJ)0K' _data/ai_tags.json

      - name: Push stats
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update stats"
            git push
          fi
